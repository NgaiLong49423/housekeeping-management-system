spring.application.name=housekeeping-management-system
# Load local settings whether IntelliJ starts from the repository root or Maven module.
spring.config.import=optional:file:.env[.properties],optional:file:app/housekeeping-management-system/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Housekeeping_Database;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Disposable local development: every application launch deletes and recreates the database.
app.database.reset-on-startup=${DB_RESET_ON_STARTUP:true}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/primary,classpath:db/shared
spring.flyway.table=flyway_primary_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Never permit an application startup to erase a database.
spring.flyway.clean-disabled=true
app.evidence.cleanup-enabled=${APP_EVIDENCE_CLEANUP_ENABLED:false}
app.payment.payos.base-url=https://api-merchant.payos.vn
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payment.payos.return-url=${PAYOS_RETURN_URL:}
app.payment.payos.cancel-url=${PAYOS_CANCEL_URL:}
app.payment.payos.webhook-url=${PAYOS_WEBHOOK_URL:}
spring.flyway.placeholders.demoDataEnabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
