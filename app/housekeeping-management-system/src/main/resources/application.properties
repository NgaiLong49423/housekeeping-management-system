spring.application.name=housekeeping-management-system
# Load local database settings from the module working directory when present.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:${demo.database.url:jdbc:sqlserver://localhost:1433;databaseName=hsf302;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${DB_USERNAME:${demo.database.username}}
spring.datasource.password=${DB_PASSWORD:${demo.database.password}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Keep clean disabled unless the local reset option below is enabled.
spring.flyway.clean-disabled=false
app.database.reset-on-startup=${DB_RESET_ON_STARTUP:false}
app.payment.payos.base-url=https://api-merchant.payos.vn
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payment.payos.return-url=${PAYOS_RETURN_URL:}
app.payment.payos.cancel-url=${PAYOS_CANCEL_URL:}
app.payment.payos.webhook-url=${PAYOS_WEBHOOK_URL:}
spring.flyway.placeholders.demoDataEnabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
