spring.application.name=housekeeping-management-system
# Load local settings whether IntelliJ starts from the workspace parent, repository root or Maven module.
spring.config.import=optional:file:.env[.properties],optional:file:app/housekeeping-management-system/.env[.properties],optional:file:housekeeping-management-system-main/app/housekeeping-management-system/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Housekeeping_Database;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:hsf302_housekeeping_local}
spring.datasource.password=${DB_PASSWORD:692E9A74A018766638F530029A13B142350FE42298FD55D9aA1!}
# Preserve database contents by default. Set DB_RESET_ON_STARTUP=true only for an intentional local reset.
app.database.reset-on-startup=${DB_RESET_ON_STARTUP:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/primary,classpath:db/shared
spring.flyway.table=flyway_primary_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Never permit an application startup to erase a database.
spring.flyway.clean-disabled=true
app.evidence.cleanup-enabled=${APP_EVIDENCE_CLEANUP_ENABLED:false}
# AES-256-GCM key for temporary customer payout account details; configure via environment.
payout.encryption-key=${PAYOUT_ENCRYPTION_KEY:}
# VNPay sandbox. Payments are verified with VNPay's QueryDR API, so no public URL is needed locally.
app.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:ZT448WV9}
app.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:TBNFGETWSGEREMULAXIHXJTPTMNWFCPU}
app.payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payment.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
app.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
app.maps.vietmap.api-key=${VIETMAP_API_KEY:demo-local-vietmap-key}
app.maps.vietmap.base-url=${VIETMAP_API_BASE_URL:https://maps.vietmap.vn}
spring.flyway.placeholders.demoDataEnabled=false
# One message may contain a 50 MB video plus up to four 5 MB images/PDFs; the evidence service enforces those per-file and count limits.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=75MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false
app.booking.arrival-early-confirmation-minutes=0
