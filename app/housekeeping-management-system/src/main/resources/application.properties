spring.application.name=housekeeping-management-system
spring.datasource.url=${DB_URL:${demo.database.url:jdbc:sqlserver://localhost:1433;databaseName=hsf302;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${DB_USERNAME:${demo.database.username}}
spring.datasource.password=${DB_PASSWORD:${demo.database.password}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
