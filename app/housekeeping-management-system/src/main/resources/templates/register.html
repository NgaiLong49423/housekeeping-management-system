<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Đăng ký tài khoản khách hàng')}">
  </head>
  <body class="auth-body">
    <header th:replace="~{fragments/layout :: header('register')}">
    </header>

    <main id="main" class="auth-page-wrap">
      <!-- Ambient Glow Behind Card -->
      <div class="auth-ambient-glow" aria-hidden="true"></div>

      <div class="auth-card auth-card--register" data-reveal="fade-up">
        <!-- Title matching image -->
        <h1 class="auth-card__title">Đăng ký</h1>
        <p class="auth-card__subtitle">Tạo tài khoản để trải nghiệm dịch vụ chăm sóc tổ ấm chuẩn mực</p>

        <!-- Registration Form with Signature Pill Inputs -->
        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="auth-form">
          <div class="auth-field-wrap">
            <input id="name" type="text" th:field="*{name}" class="auth-input" maxlength="150" autocomplete="name" required placeholder="Họ và tên">
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="auth-field-error"></div>
          </div>

          <div class="auth-field-wrap">
            <input id="email" type="email" th:field="*{email}" class="auth-input" maxlength="254" autocomplete="email" required placeholder="E-mail">
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="auth-field-error"></div>
          </div>

          <div class="auth-field-wrap">
            <input id="phone" type="tel" th:field="*{phone}" class="auth-input" maxlength="20" autocomplete="tel" required placeholder="Số điện thoại">
            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="auth-field-error"></div>
          </div>

          <div class="auth-field-wrap">
            <input id="password" name="password" type="password" class="auth-input" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Mật khẩu (8 - 72 ký tự)">
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="auth-field-error"></div>
          </div>

          <div class="auth-field-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" class="auth-input" maxlength="72" autocomplete="new-password" required placeholder="Nhập lại mật khẩu">
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="auth-field-error"></div>
          </div>

          <button type="submit" class="auth-btn-primary">
            <span>Tạo tài khoản</span>
          </button>
        </form>

        <!-- Social Section (matching reference image) -->
        <div class="auth-social-section">
          <span class="auth-social-label">Hoặc đăng ký nhanh với</span>
          <div class="auth-social-row">
            <button type="button" class="auth-social-btn" aria-label="Đăng ký với Google" onclick="showAuthNotice('Đăng ký qua Google sẽ sớm khả dụng.')">
              <svg th:replace="~{fragments/icons :: brand-google}"></svg>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Đăng ký với Apple" onclick="showAuthNotice('Đăng ký qua Apple ID sẽ sớm khả dụng.')">
              <svg th:replace="~{fragments/icons :: brand-apple}"></svg>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Đăng ký với X" onclick="showAuthNotice('Đăng ký qua X sẽ sớm khả dụng.')">
              <svg th:replace="~{fragments/icons :: brand-x}"></svg>
            </button>
          </div>
        </div>

        <!-- Footer terms & Switch link -->
        <div class="auth-card__footer">
          <a th:href="@{/login}" class="auth-footer-link auth-footer-link--action">
            Đã có tài khoản? <strong>Đăng nhập ngay</strong>
          </a>
          <a href="javascript:void(0)" class="auth-footer-link auth-footer-link--agreement" onclick="showAuthNotice('Bằng cách tạo tài khoản, bạn đồng ý với Điều khoản dịch vụ và Chính sách quyền riêng tư của Gọn Nhà.')">
            Điều khoản &amp; Thỏa thuận người dùng
          </a>
        </div>
      </div>
    </main>

    <!-- Quick Soft Toast for Social / Notice Click -->
    <div id="authNoticeToast" class="auth-toast" role="status" aria-live="polite"></div>

    <footer th:replace="~{fragments/layout :: footer}">
    </footer>
  </body>
</html>
