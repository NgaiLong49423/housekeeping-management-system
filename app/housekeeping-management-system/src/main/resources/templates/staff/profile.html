<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Hồ sơ của tôi')}"><title>Hồ sơ của tôi · Gọn Nhà</title></head>
  <body>
    <header th:replace="~{fragments/layout :: header('profile')}"></header>
    <main id="main" class="container py-4 py-md-5">
      <div class="page-heading"><span class="eyebrow">Tài khoản nhân viên</span><h1>Hồ sơ của tôi</h1>
        <p class="lead">Cập nhật ảnh đại diện và phần giới thiệu để khách hàng hiểu thêm về bạn.</p></div>
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <form method="post" th:action="@{/staff/profile}" th:object="${profileForm}" class="surface p-4">
        <div class="mb-3"><label for="avatarUrl" class="form-label">URL ảnh đại diện (HTTPS)</label>
          <input id="avatarUrl" class="form-control" type="url" th:field="*{avatarUrl}" maxlength="500" placeholder="https://example.com/avatar.jpg">
          <div class="form-text">Có thể để trống. Hệ thống chỉ lưu địa chỉ ảnh, không tải ảnh lên máy chủ.</div></div>
        <div class="mb-4"><label for="bio" class="form-label">Giới thiệu</label>
          <textarea id="bio" class="form-control" rows="7" th:field="*{bio}" maxlength="5000" placeholder="Chia sẻ kinh nghiệm và cách bạn chăm sóc không gian sống."></textarea></div>
        <button class="btn btn-primary" type="submit">Lưu hồ sơ</button>
      </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
