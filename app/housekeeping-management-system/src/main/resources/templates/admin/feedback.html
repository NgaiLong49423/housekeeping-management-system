<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Phản hồi khách hàng')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header('feedback')}"></header>
    <main id="main" class="container py-4 py-md-5">
      <div class="page-heading">
        <span class="eyebrow">Quản lý vận hành · Gọn Nhà</span>
        <h1>Phản hồi khách hàng</h1>
        <p class="lead">Đọc góp ý theo từng lịch hẹn, gửi phản hồi và đánh dấu nội dung đã giải quyết.</p>
      </div>
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <section class="surface p-4">
        <p th:if="${#lists.isEmpty(feedback)}" class="text-secondary mb-0">Chưa có phản hồi nào.</p>
        <article th:each="item : ${feedback}" class="border-bottom py-4">
          <div class="d-flex flex-wrap justify-content-between gap-2">
            <h2 class="h6 mb-0" th:text="|${item.customerName} · Lịch #${item.bookingId}|">Khách hàng · Lịch</h2>
            <span class="badge" th:classappend="${item.status == 'RESOLVED'} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${item.status == 'RESOLVED'} ? 'Đã giải quyết' : 'Đang mở'">Đang mở</span>
          </div>
          <p class="mt-3 mb-2" style="white-space: pre-wrap" th:text="${item.content}">Nội dung phản hồi</p>
          <p th:if="${item.adminReply != null}" class="small text-secondary" style="white-space: pre-wrap">
            <strong>Phản hồi hiện tại:</strong> <span th:text="${item.adminReply}"></span>
          </p>
          <form method="post" class="vstack gap-2" th:action="@{/admin/feedback/{id}/reply(id=${item.id})}">
            <label class="form-label mb-0" th:for="|reply-${item.id}|">Trả lời khách hàng</label>
            <textarea class="form-control" rows="3" name="reply" th:id="|reply-${item.id}|" required></textarea>
            <button class="btn btn-outline-primary align-self-start" type="submit">Lưu trả lời</button>
          </form>
          <form th:if="${item.status == 'OPEN'}" method="post" class="mt-2" th:action="@{/admin/feedback/{id}/resolve(id=${item.id})}">
            <button class="btn btn-success" type="submit">Đánh dấu đã giải quyết</button>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
