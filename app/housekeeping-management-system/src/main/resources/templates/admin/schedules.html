<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Lịch sẵn sàng toàn hệ thống')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header('schedules')}"></header>
    <main id="main" class="container py-4 py-md-5">
      <div class="page-heading">
        <span class="eyebrow">Theo dõi lịch nhân viên</span>
        <h1>Lịch sẵn sàng toàn hệ thống</h1>
        <p class="lead">Các khoảng sẵn sàng do nhân viên bán thời gian đăng ký, theo giờ Việt Nam (UTC+7).</p>
      </div>
      <div th:replace="~{fragments/layout :: alerts}"></div>
      <section class="surface p-4">
        <div class="empty-state py-5" th:if="${#lists.isEmpty(schedules)}">
          <span class="empty-icon" aria-hidden="true">⏱</span>
          <h3>Chưa có khoảng sẵn sàng</h3>
          <p>Nhân viên chưa đăng ký khoảng thời gian nào.</p>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(schedules)}">
          <table class="table align-middle">
            <thead><tr><th>Nhân viên</th><th>Ngày</th><th>Bắt đầu</th><th>Kết thúc</th></tr></thead>
            <tbody>
              <tr th:each="slot : ${schedules}">
                <td th:text="${slot.staffName}">Nhân viên</td>
                <td th:text="${#temporals.format(slot.start, 'dd/MM/yyyy')}">Ngày</td>
                <td th:text="${#temporals.format(slot.start, 'HH:mm')}">08:00</td>
                <td th:text="${#temporals.format(slot.end, 'HH:mm')}">12:00</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>
