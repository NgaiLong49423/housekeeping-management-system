<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Dịch vụ')}">
  </head>
  <body>
    <header th:replace="~{fragments/layout :: header('services')}">
    </header>
    <main id="main">
      <!-- Page Header -->
      <section class="container pt-4 pt-md-5 pb-3">
        <div class="page-heading">
          <span class="eyebrow">
            <svg th:replace="~{fragments/icons :: sparkles}"></svg>
            <span>Một chút chăm sóc, thêm nhiều thảnh thơi</span>
          </span>
          <h1>
            Dịch vụ cho tổ ấm của bạn
          </h1>
          <p class="lead">
            Giá được tính theo từng dịch vụ cụ thể. Thanh toán an tâm sau khi công việc được nghiệm thu hoàn thành.
          </p>
        </div>
      </section>

      <!-- Services Catalog -->
      <section class="container pb-5">
        <div th:replace="~{fragments/services :: cards}">
        </div>
      </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}">
    </footer>
  </body>
</html>
