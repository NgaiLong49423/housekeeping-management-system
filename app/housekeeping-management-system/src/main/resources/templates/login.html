<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Đăng nhập')}">
  </head>
  <body class="auth-body">
    <header th:replace="~{fragments/layout :: header('login')}">
    </header>

    <main id="main" class="auth-page-wrap">
      <!-- Ambient Glow Behind Card -->
      <div class="auth-ambient-glow" aria-hidden="true"></div>

      <div class="auth-card" data-reveal="fade-up">
        <!-- Title matching image -->
        <h1 class="auth-card__title">Đăng nhập</h1>

        <!-- Status & Error Alerts -->
        <div th:if="${param.error}" class="auth-alert auth-alert--danger" role="alert">
          <svg th:replace="~{fragments/icons :: alert-circle}"></svg>
          <span>Email hoặc mật khẩu không đúng.</span>
        </div>
        <div th:if="${param.locked}" class="auth-alert auth-alert--danger" role="alert">
          <svg th:replace="~{fragments/icons :: alert-circle}"></svg>
          <span>
            <strong>Tài khoản của bạn đã bị khóa.</strong>
            <span class="d-block" th:if="${!#strings.isEmpty(lockReason)}">Lý do: <span th:text="${lockReason}">Lý do khóa</span></span>
            <span class="d-block">Vui lòng liên hệ Gọn Nhà nếu cần hỗ trợ.</span>
          </span>
        </div>
        <div th:if="${param.logout}" class="auth-alert auth-alert--success" role="status">
          <svg th:replace="~{fragments/icons :: check-circle}"></svg>
          <span>Bạn đã đăng xuất an toàn.</span>
        </div>
        <div th:if="${param.registered}" class="auth-alert auth-alert--success" role="status">
          <svg th:replace="~{fragments/icons :: check-circle}"></svg>
          <span>Đăng ký thành công! Đăng nhập để tiếp tục.</span>
        </div>

        <!-- Login Form with Signature Pill Inputs -->
        <form th:action="@{/login}" method="post" class="auth-form">
          <div class="auth-field-wrap">
            <input id="email" name="email" type="email" class="auth-input" autocomplete="username" maxlength="254" required autofocus placeholder="E-mail">
          </div>
          <div class="auth-field-wrap">
            <input id="password" name="password" type="password" class="auth-input" autocomplete="current-password" required placeholder="Password">
          </div>

          <div class="auth-sub-links">
            <a href="javascript:void(0)" class="auth-link-forgot" onclick="showAuthNotice('Vui lòng liên hệ hotline 1900-6868 hoặc quản trị viên để khôi phục mật khẩu.')">
              Quên mật khẩu ?
            </a>
          </div>

          <button type="submit" class="auth-btn-primary">
            <span>Đăng nhập</span>
          </button>
        </form>

        <!-- Footer terms & Switch link -->
        <div class="auth-card__footer">
          <a th:href="@{/register}" class="auth-footer-link auth-footer-link--action">
            Bạn chưa có tài khoản? <strong>Đăng ký ngay</strong>
          </a>
          <a href="javascript:void(0)" class="auth-footer-link auth-footer-link--agreement" onclick="showAuthNotice('Điều khoản dịch vụ bảo vệ quyền lợi và bảo mật thông tin khách hàng tại Gọn Nhà.')">
            Điều khoản &amp; Thỏa thuận người dùng
          </a>
        </div>
      </div>
    </main>

    <!-- Quick Soft Toast for Social / Forgot Password Click -->
    <div id="authNoticeToast" class="auth-toast" role="status" aria-live="polite"></div>

    <footer th:replace="~{fragments/layout :: footer}">
    </footer>
  </body>
</html>
