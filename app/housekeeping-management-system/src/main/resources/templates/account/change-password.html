<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}">
  </head>
  <body class="auth-body">
    <main id="main" class="auth-page-wrap">
      <div class="auth-ambient-glow" aria-hidden="true"></div>
      <section class="auth-card" data-reveal="fade-up" aria-labelledby="change-password-title">
        <h1 id="change-password-title" class="auth-card__title">Đổi mật khẩu</h1>
        <p class="auth-card__subtitle">Đây là lần đăng nhập đầu tiên. Hãy thay mật khẩu tạm thời để tiếp tục sử dụng hệ thống.</p>

        <div th:if="${error}" class="auth-alert auth-alert--danger" role="alert" th:text="${error}"></div>

        <form th:action="@{/account/change-password}" method="post" class="auth-form">
          <div class="auth-field-wrap">
            <input id="currentPassword" name="currentPassword" type="password" class="auth-input"
                   autocomplete="current-password" maxlength="72" required autofocus
                   placeholder="Mật khẩu hiện tại" aria-label="Mật khẩu hiện tại">
          </div>
          <div class="auth-field-wrap">
            <input id="newPassword" name="newPassword" type="password" class="auth-input"
                   autocomplete="new-password" minlength="8" maxlength="72" required
                   placeholder="Mật khẩu mới (ít nhất 8 ký tự)" aria-label="Mật khẩu mới">
          </div>
          <div class="auth-field-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" class="auth-input"
                   autocomplete="new-password" maxlength="72" required
                   placeholder="Xác nhận mật khẩu mới" aria-label="Xác nhận mật khẩu mới">
          </div>
          <button type="submit" class="auth-btn-primary"><span>Lưu mật khẩu mới</span></button>
        </form>

        <form th:action="@{/logout}" method="post" class="mt-3 text-center">
          <button type="submit" class="btn btn-link text-secondary">Đăng xuất</button>
        </form>
      </section>
    </main>
  </body>
</html>
