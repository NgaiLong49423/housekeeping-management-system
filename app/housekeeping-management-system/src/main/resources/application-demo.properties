# Public local-demo defaults matching database/setup-demo.sql. Never use for deployment.
# .env is resolved from the working directory (the Maven module for Housekeeping Demo).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Housekeeping_Database;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/primary,classpath:db/shared
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
server.address=127.0.0.1
spring.thymeleaf.cache=false
app.maps.vietmap.api-key=${VIETMAP_API_KEY:demo-local-vietmap-key}
