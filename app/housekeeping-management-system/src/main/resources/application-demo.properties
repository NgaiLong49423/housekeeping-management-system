# Public local-demo defaults matching database/setup-demo.sql. Never use for deployment.
# .env is resolved from the working directory (the Maven module for Housekeeping Demo).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=home_cleaning_demo;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/refactor
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
app.demo.account-password=${DEMO_ACCOUNT_PASSWORD:}
spring.flyway.placeholders.demoDataEnabled=true
server.address=127.0.0.1
