spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Housekeeping_Database;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/primary,classpath:db/shared
spring.flyway.table=flyway_primary_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.booking.arrival-early-confirmation-minutes=5
server.address=127.0.0.1
spring.thymeleaf.cache=false
app.maps.vietmap.api-key=${VIETMAP_API_KEY:demo-local-vietmap-key}
