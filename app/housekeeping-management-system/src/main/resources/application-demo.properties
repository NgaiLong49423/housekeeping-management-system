# Local demo profile uses the project's configured SQL Server database.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Housekeeping_Database;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/primary,classpath:db/shared
spring.flyway.table=flyway_primary_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
app.database.reset-on-startup=false
server.address=127.0.0.1
