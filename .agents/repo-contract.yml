contract_version: 1
repository:
  purpose: housekeeping-management-web-application
  application_directory: app/
  database_directory: database/
  documentation_directory: docs/
  agent_directory: .agents/
technology:
  language: Java 21
  framework: Spring Boot 4.1.1
  web: Spring MVC, Thymeleaf, Bootstrap
  persistence: Spring Data JPA and Hibernate
  database: Microsoft SQL Server
  migrations: Flyway
  architecture: single Maven project with MVC and N-Layer packages
canonical_docs:
  overview: README.md
  contribution: CONTRIBUTING.md
  changelog: CHANGELOG.md
  requirements:
    - docs/requirements/PRD.md
    - docs/requirements/SRS.md
  data_dictionary: docs/requirements/SQL_SERVER_DATA_DICTIONARY.md
  database_guide: database/README.md
agent_assets:
  policy: .agents/POLICY.md
  skills: .agents/skills/
  workflows: .agents/workflows/
  scripts: .agents/scripts/
local_only:
  - .agents/outputs/
protected_paths:
  paths:
    - docs/diagrams/
  rule: Exclude before selecting, enumerating, or traversing inputs; never inspect linked targets inside protected paths.
validation_inputs:
  files:
    - AGENTS.md
    - README.md
    - CONTRIBUTING.md
    - CHANGELOG.md
    - .agents/POLICY.md
    - .agents/repo-contract.yml
    - docs/README.md
    - docs/template-maintenance.md
    - docs/requirements/SQL_SERVER_DATA_DICTIONARY.md
    - database/README.md
  directories:
    - app/
    - database/
    - .agents/skills/
    - .agents/workflows/
    - .agents/scripts/
    - .github/ISSUE_TEMPLATE/
    - .github/workflows/
    - docs/requirements/
    - docs/reports/
rules:
  no_framework_or_dbms_default: false
  skill_folder_must_match_frontmatter_name: true
  use_relative_document_links: true
  github_required_checks_are_not_configured_by_workflow_files: true
